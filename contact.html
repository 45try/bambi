<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - BambiFix</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <img src="images/logo.png" alt="BambiFix Logo" class="logo">
            <button class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu" id="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="contact">
        <h2>Contact Us</h2>
        <div class="contact-wrapper">
            <div class="contact-info">
                <h3>Get in Touch</h3>
                <div class="info-item">
                    <span class="info-label">📍 Location:</span>
                    <p>Kyebando, Uganda</p>
                </div>
                <div class="info-item">
                    <span class="info-label">✉️ Email:</span>
                    <p>info@bambifix.com</p>
                </div>
                <div class="info-item">
                    <span class="info-label">📞 Phone:</span>
                    <p>+256 782 954 109</p>
                    <p>+256 701 298 755</p>
                </div>
            </div>

            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Your Full Name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your.email@example.com" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="+256 XXX XXX XXX">
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" placeholder="Message Subject" required>
                </div>
                <div class="form-group full-width">
                    <label for="message">Message</label>
                    <textarea id="message" placeholder="Your Message Here..." rows="6" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 BambiFix. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
